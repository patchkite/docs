name: Deploy

# Builds the static site into an nginx image and pushes it to GHCR.
# The VM pulls the new image automatically (see deploy/docker-compose.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/patchkite/docsatest
            ghcr.io/patchkite/docs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
