# Runs on the VM. Watchtower pulls new images pushed by the Deploy workflow.
# Private repositories need a one-time `docker login ghcr.io` on the VM (read:packages token).
services:
  docs:
    image: ghcr.io/patchkite/docsatest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    command: --label-enable --interval 60 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
